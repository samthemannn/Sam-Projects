services:
  db:
    image: postgres:16-alpine
    container_name: book-rating-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: book_rating_platform
      POSTGRES_USER: book_app
      POSTGRES_PASSWORD: book_app_dev_password
    ports:
      - "5432:5432"
    volumes:
      - book_rating_postgres_data:/var/lib/postgresql/data
      - ./backend/src/BookRatingPlatform.Infrastructure/Migrations/001_InitialSchema.sql:/docker-entrypoint-initdb.d/001_InitialSchema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_app -d book_rating_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  book_rating_postgres_data:

