<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Show | Jeopardy-style Trivia</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f5f6ff;background:#090d23}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#273c90 0,#101735 42%,#090d23 85%);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}.shell{max-width:1300px;margin:auto;padding:26px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:1.35rem;font-weight:900;letter-spacing:.12em;color:#ffdc77}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #53619b;background:#222e61;color:white;padding:11px 17px;border-radius:11px;font-weight:700}.btn:hover:not(:disabled){background:#35468b}.primary{background:#f6c951;color:#131b3d;border-color:#f6c951}.primary:hover:not(:disabled){background:#ffdf84}.danger{border-color:#a44b67}.hero{text-align:center;margin:35px auto 25px}.eyebrow{color:#a6b6ed;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(2.2rem,6vw,4.7rem);margin:10px 0;color:#ffdf7a;letter-spacing:.07em;text-shadow:0 4px #4b316c}.muted{color:#bac4e8}.panel{background:#151e43;border:1px solid #394679;border-radius:17px;padding:22px;margin-top:18px;box-shadow:0 14px 45px #0003}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.scoreboard{display:flex;gap:12px;flex-wrap:wrap}.score{background:#1b2755;border:1px solid #485a9b;border-radius:13px;padding:12px 18px;min-width:150px;flex:1}.score strong{display:block;font-size:1.65rem;color:#ffdc77}.score small{color:#b9c6f2}.board{display:grid;gap:8px;margin-top:20px}.tile{min-height:91px;border:1px solid #4861c1;border-radius:8px;background:linear-gradient(155deg,#183da8,#0c2371);color:#ffdf77;font-weight:900;font-size:clamp(1rem,2.2vw,2rem);box-shadow:inset 0 0 16px #ffffff0a}.tile:hover:not(:disabled){background:#2854ca;transform:translateY(-2px)}.category{font-size:clamp(.67rem,1.2vw,1rem);color:white;text-transform:uppercase;overflow-wrap:anywhere;padding:8px}.used{background:#111b40;border-color:#26335d;color:transparent}.section-title{margin:0 0 15px}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.field label{font-size:.85rem;color:#c3cdf2;font-weight:700}input,textarea,select{background:#0c1431;color:#fff;border:1px solid #526199;border-radius:9px;padding:11px;width:100%}textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.question-card{max-width:780px;margin:20px auto;text-align:center}.question-card h2{font-size:clamp(1.4rem,3vw,2.5rem);line-height:1.35}.answer{padding:18px;background:#0d1739;border:1px solid #5366a6;border-radius:12px;margin:20px 0;color:#ffdc77;font-size:1.3rem}.hidden{display:none!important}.editor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.editor-category{background:#101938;border:1px solid #3c4b80;border-radius:12px;padding:15px}.editor-question{padding:12px 0;border-top:1px solid #35436e}.editor-question .field{margin:8px 0}.pill{background:#29386e;color:#cbd6ff;border-radius:50px;padding:6px 12px;font-size:.8rem;font-weight:800}.notice{padding:12px 16px;border-radius:10px;background:#253a66;color:#dce6ff;margin:12px 0}.leader{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #394679;font-size:1.2rem}.footer{text-align:center;color:#8d9bc6;margin-top:35px;font-size:.8rem}@media(max-width:700px){.shell{padding:14px 10px 35px}.tile{min-height:62px}.board{gap:4px}.score{min-width:115px}.panel{padding:14px}.tile.category{font-size:.58rem}}
</style></head><body><div class="shell">
<header class="top"><div class="brand">★ QUIZ SHOW</div><nav class="nav"><button class="btn" data-page="home">Home</button><button class="btn" data-page="game">Game Board</button><button class="btn" data-page="editor">Question Editor</button><button class="btn" data-page="results">Results</button></nav></header>
<main id="app"></main><footer class="footer">Made for classroom competitions and trivia nights · Games are saved in this browser</footer></div>
<script>
const KEY='quizshow-v1',VALUES=[200,400,600,800,1000];
const sample=[
{name:'Science',q:[['What planet is known as the Red Planet?','Mars'],['What gas do plants absorb during photosynthesis?','Carbon dioxide'],['What is the chemical symbol for gold?','Au'],['What force keeps planets in orbit around the Sun?','Gravity'],['What is the powerhouse of the cell?','Mitochondrion']]},
{name:'History',q:[['Who was the first president of the United States?','George Washington'],['In what year did World War II end?','1945'],['Which civilization built Machu Picchu?','The Inca'],['What wall fell in Germany in 1989?','The Berlin Wall'],['Who was the first woman to win a Nobel Prize?','Marie Curie']]},
{name:'Sports',q:[['How many players are on a soccer team on the field?','11'],['What sport uses a shuttlecock?','Badminton'],['How many points is a touchdown worth?','6'],['In tennis, what is a score of zero called?','Love'],['What country hosted the first modern Olympic Games in 1896?','Greece']]},
{name:'Movies',q:[['What is the name of the cowboy in Toy Story?','Woody'],['Which film features the song Let It Go?','Frozen'],['What is the fictional African nation in Black Panther?','Wakanda'],['Who directed Jurassic Park (1993)?','Steven Spielberg'],['What 1997 film features Jack and Rose aboard a ship?','Titanic']]},
{name:'Technology',q:[['What does CPU stand for?','Central Processing Unit'],['What does HTML stand for?','HyperText Markup Language'],['What company created the iPhone?','Apple'],['What does URL stand for?','Uniform Resource Locator'],['What does SQL stand for?','Structured Query Language']]}
].map(c=>({name:c.name,questions:c.q.map((a,i)=>({text:a[0],answer:a[1],value:VALUES[i],type:'short',options:[]}))}));
const clone=x=>JSON.parse(JSON.stringify(x));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.categories)){state={categories:clone(sample),players:[{name:'Team 1',score:0},{name:'Team 2',score:0}],used:[],active:null,started:false,sets:{},page:'home'}}
state.sets=state.sets||{};state.used=state.used||[];state.players=state.players||[];
const app=document.getElementById('app');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Browser storage is full or unavailable.')}};const go=p=>{state.page=p;save();render()};const key=(c,q)=>c+'-'+q;
const btn=(label,action,extra='')=>'<button class="btn '+extra+'" data-action="'+action+'">'+label+'</button>';
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false'));if(state.page==='home')home();else if(state.page==='game')game();else if(state.page==='editor')editor();else results()}
function home(){app.innerHTML='<section class="hero"><div class="eyebrow">The ultimate trivia night</div><h1>READY TO PLAY?</h1><p class="muted">Build a board. Gather your teams. Let the trivia begin.</p></section><section class="panel"><h2 class="section-title">Set up your game</h2><div class="row spread"><span class="pill">'+state.categories.length+' categories · '+state.categories.reduce((n,c)=>n+c.questions.length,0)+' questions</span>'+btn('Start / Continue Game','start','primary')+'</div><h3>Players & teams</h3><div id="playerList"></div><div class="row"><div class="field"><label for="newPlayer">New player or team</label><input id="newPlayer" maxlength="40" placeholder="e.g. The Brainiacs"></div>'+btn('Add team','add-player')+'</div><div class="row" style="margin-top:20px">'+btn('Edit question board','edit')+btn('Reset scores and board','reset','danger')+'</div></section><section class="panel"><h2>Saved question sets</h2><div class="row"><div class="field"><label for="setName">Save current questions as</label><input id="setName" maxlength="60" placeholder="e.g. Friday Trivia"></div>'+btn('Save set','save-set')+'</div><div id="savedSets"></div></section>';renderPlayers();renderSets()}
function renderPlayers(){const target=document.getElementById('playerList');if(!target)return;target.innerHTML=state.players.map((p,i)=>'<div class="row spread" style="margin:9px 0"><strong>'+escapeHTML(p.name)+'</strong><div class="row"><span class="pill">'+p.score+' pts</span><button class="btn" data-action="remove-player" data-index="'+i+'" aria-label="Remove '+escapeHTML(p.name)+'">Remove</button></div></div>').join('')||'<p class="muted">Add at least one team to begin.</p>'}
function renderSets(){const target=document.getElementById('savedSets');if(!target)return;target.innerHTML=Object.keys(state.sets).map(n=>'<div class="row spread" style="margin-top:12px"><strong>'+escapeHTML(n)+'</strong><div class="row"><button class="btn" data-action="load-set" data-name="'+escapeHTML(n)+'">Load</button><button class="btn danger" data-action="delete-set" data-name="'+escapeHTML(n)+'">Delete</button></div></div>').join('')||'<p class="muted">No saved sets yet.</p>'}
function scores(){return '<div class="scoreboard">'+state.players.map((p,i)=>'<div class="score"><small>'+escapeHTML(p.name)+'</small><strong>'+p.score+'</strong><div class="row"><button class="btn" data-action="adjust" data-index="'+i+'" data-delta="-100" aria-label="Subtract 100 from '+escapeHTML(p.name)+'">−100</button><button class="btn" data-action="adjust" data-index="'+i+'" data-delta="100" aria-label="Add 100 to '+escapeHTML(p.name)+'">+100</button></div></div>').join('')+'</div>'}
function game(){const total=state.categories.reduce((n,c)=>n+c.questions.length,0),remaining=total-state.used.length;if(state.active){question();return}app.innerHTML='<section class="hero"><div class="eyebrow">Game in progress</div><h1>JEOPARDY!</h1><p class="muted">'+remaining+' questions remaining</p></section>'+scores()+'<div class="board" id="board" style="grid-template-columns:repeat('+state.categories.length+',minmax(0,1fr))">'+state.categories.map(c=>'<div class="tile category" style="display:grid;place-items:center">'+escapeHTML(c.name)+'</div>').join('')+Array.from({length:Math.max(0,...state.categories.map(c=>c.questions.length))},(_,qi)=>state.categories.map((c,ci)=>{const q=c.questions[qi];return q?'<button class="tile '+(state.used.includes(key(ci,qi))?'used':'')+'" data-action="question" data-c="'+ci+'" data-q="'+qi+'" '+(state.used.includes(key(ci,qi))?'disabled':'')+' aria-label="'+escapeHTML(c.name)+' for '+q.value+'">'+(state.used.includes(key(ci,qi))?'':q.value)+'</button>':'<div></div>'}).join('')).join('')+'</div><div class="row spread" style="margin-top:20px">'+btn('Manage teams','home')+(remaining===0?btn('See final results','results','primary'):btn('End game & results','results'))+'</div>'}
function question(){const {c,q}=state.active,item=state.categories[c].questions[q];app.innerHTML='<section class="panel question-card"><div class="eyebrow">'+escapeHTML(state.categories[c].name)+' · '+item.value+' points</div><h2>'+escapeHTML(item.text)+'</h2>'+(item.type==='multiple'&&item.options?.length?'<div class="panel" style="text-align:left">'+item.options.map((o,i)=>'<p><strong>'+String.fromCharCode(65+i)+'.</strong> '+escapeHTML(o)+'</p>').join('')+'</div>':'')+'<div id="answer" class="answer '+(state.active.revealed?'':'hidden')+'"><small>Correct answer</small><div>'+escapeHTML(item.answer)+'</div></div><div class="row" style="justify-content:center">'+(!state.active.revealed?btn('Reveal answer','reveal','primary'):'')+btn('Back to board','back')+'</div>'+(state.active.revealed?'<h3>Award or deduct points</h3><div class="form-grid">'+state.players.map((p,i)=>'<div class="panel"><strong>'+escapeHTML(p.name)+'</strong><div class="row" style="margin-top:12px"><button class="btn primary" data-action="grade" data-index="'+i+'" data-sign="1">Correct +'+item.value+'</button><button class="btn danger" data-action="grade" data-index="'+i+'" data-sign="-1">Incorrect −'+item.value+'</button></div></div>').join('')+'</div><p class="muted">Choose a team to score and return to the board, or use Back to board to skip scoring.</p>':'')+'</section>'}
function editor(){app.innerHTML='<section class="hero"><div class="eyebrow">Make it yours</div><h1>QUESTION EDITOR</h1><p class="muted">Edit categories, prompts, answers and point values.</p></section><div class="row spread">'+btn('Add category','add-category')+btn('Save changes & play','editor-done','primary')+'</div><div class="editor-grid" id="editorGrid"></div>';const grid=document.getElementById('editorGrid');grid.innerHTML=state.categories.map((c,ci)=>'<section class="editor-category"><div class="field"><label>Category name</label><input data-edit="category" data-c="'+ci+'" value="'+escapeHTML(c.name)+'"></div><div class="row spread" style="margin:12px 0"><strong>'+c.questions.length+' questions</strong><button class="btn danger" data-action="remove-category" data-c="'+ci+'">Delete category</button></div>'+c.questions.map((q,qi)=>'<div class="editor-question"><div class="row spread"><strong>Question '+(qi+1)+'</strong><button class="btn danger" data-action="remove-question" data-c="'+ci+'" data-q="'+qi+'">Delete</button></div><div class="field"><label>Question</label><textarea data-edit="text" data-c="'+ci+'" data-q="'+qi+'">'+escapeHTML(q.text)+'</textarea></div><div class="field"><label>Correct answer</label><input data-edit="answer" data-c="'+ci+'" data-q="'+qi+'" value="'+escapeHTML(q.answer)+'"></div><div class="field"><label>Points</label><input type="number" min="1" data-edit="value" data-c="'+ci+'" data-q="'+qi+'" value="'+q.value+'"></div><div class="field"><label>Question type</label><select data-edit="type" data-c="'+ci+'" data-q="'+qi+'"><option value="short" '+(q.type==='short'?'selected':'')+'>Short answer</option><option value="multiple" '+(q.type==='multiple'?'selected':'')+'>Multiple choice</option></select></div><div class="field"><label>Multiple-choice options (one per line)</label><textarea data-edit="options" data-c="'+ci+'" data-q="'+qi+'" placeholder="Option A&#10;Option B&#10;Option C">'+escapeHTML((q.options||[]).join('\n'))+'</textarea></div></div>').join('')+'<button class="btn" data-action="add-question" data-c="'+ci+'">+ Add question</button></section>').join('')}
function results(){const ranked=[...state.players].sort((a,b)=>b.score-a.score);app.innerHTML='<section class="hero"><div class="eyebrow">Game over</div><h1>FINAL SCORES</h1><p class="muted">'+(ranked.length?'Congratulations, '+escapeHTML(ranked[0].name)+(ranked.length>1&&ranked[0].score===ranked[1].score?' — it is a tie!':'!'):'Add players to see results.')+'</p></section><section class="panel">'+ranked.map((p,i)=>'<div class="leader"><span>'+(i+1)+'. '+escapeHTML(p.name)+'</span><strong>'+p.score+' pts</strong></div>').join('')+'<div class="row" style="margin-top:22px">'+btn('Return to board','game')+btn('Play again','reset','primary')+'</div></section>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}const a=b.dataset.action,i=Number(b.dataset.index),c=Number(b.dataset.c),q=Number(b.dataset.q);switch(a){
case 'start':if(!state.players.length){alert('Add a team first.');break}state.started=true;go('game');return;
case 'home':go('home');return;case 'edit':go('editor');return;case 'game':go('game');return;case 'results':go('results');return;
case 'add-player':{const el=document.getElementById('newPlayer'),name=el.value.trim();if(name&&state.players.length<12&&!state.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))state.players.push({name,score:0});else alert('Enter a unique team name (maximum 12 teams).');break}
case 'remove-player':state.players.splice(i,1);break;
case 'reset':if(!confirm('Reset all scores and answered questions? Your question sets will be kept.'))return;state.used=[];state.active=null;state.players.forEach(p=>p.score=0);state.started=false;go('home');return;
case 'question':if(state.used.includes(key(c,q)))return;state.active={c,q,revealed:false};go('game');return;
case 'reveal':state.active.revealed=true;break;
case 'back':{const {c,q}=state.active;if(!state.used.includes(key(c,q)))state.used.push(key(c,q));state.active=null;go('game');return}
case 'grade':{const {c,q}=state.active;state.players[i].score+=state.categories[c].questions[q].value*Number(b.dataset.sign);if(!state.used.includes(key(c,q)))state.used.push(key(c,q));state.active=null;go('game');return}
case 'adjust':state.players[i].score+=Number(b.dataset.delta);break;
case 'add-category':if(state.categories.length>=6){alert('Maximum 6 categories.');return}state.categories.push({name:'New Category',questions:VALUES.map(v=>({text:'New question',answer:'Answer',value:v,type:'short',options:[]}))});state.used=[];break;
case 'remove-category':if(!confirm('Delete this category and reset answered questions?'))return;state.categories.splice(c,1);state.used=[];break;
case 'add-question':state.categories[c].questions.push({text:'New question',answer:'Answer',value:(state.categories[c].questions.length+1)*200,type:'short',options:[]});state.used=[];break;
case 'remove-question':state.categories[c].questions.splice(q,1);state.used=[];break;
case 'editor-done':state.used=[];state.active=null;go('game');return;
case 'save-set':{const n=document.getElementById('setName').value.trim();if(!n){alert('Enter a set name.');return}state.sets[n]=clone(state.categories);break}
case 'load-set':if(!confirm('Load this question set? Current board progress will reset.'))return;state.categories=clone(state.sets[b.dataset.name]);state.used=[];state.active=null;break;
case 'delete-set':if(!confirm('Delete saved set?'))return;delete state.sets[b.dataset.name];break;
}save();render()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.edit)return;const c=Number(el.dataset.c),q=Number(el.dataset.q),field=el.dataset.edit;if(field==='category')state.categories[c].name=el.value.trim()||'Untitled';else{const item=state.categories[c].questions[q];item[field]=field==='value'?Math.max(1,Number(el.value)||200):field==='options'?el.value.split('\n').map(x=>x.trim()).filter(Boolean):el.value}state.used=[];save()});
render();
</script></body></html>
